<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E88F1B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background grid & glow -->
  <rect width="1000" height="520" fill="transparent"/>
  <circle cx="520" cy="270" r="240" fill="url(#mapGlow)"/>

  <!-- World / Regional outline map stylized in dark tech aesthetic -->
  <g opacity="0.32" stroke="#4A5568" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- India & Indian Ocean Outline contour simplified stylized -->
    <path d="M420,120 Q480,110 520,140 T560,180 T600,240 T570,320 T520,400 T480,450 T460,400 T440,320 T400,240 T380,180 Z" fill="#1A202C" stroke="#718096" stroke-dasharray="3 3"/>
    
    <!-- State boundary / Kerala coast highlight -->
    <path d="M455,340 C452,365 448,390 450,415 C453,435 458,450 460,460" stroke="#E88F1B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Network nodes connection lines -->
  <g stroke="#E88F1B" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 4">
    <line x1="450" y1="365" x2="455" y2="390" />
    <line x1="455" y1="390" x2="468" y2="400" />
    <line x1="455" y1="390" x2="456" y2="435" />
  </g>

  <!-- Pin 1: Calicut -->
  <g transform="translate(450, 365)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="14" fill="#E88F1B" opacity="0.25">
      <animate attributeName="r" values="8;18;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#E88F1B"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <rect x="12" y="-12" width="62" height="22" rx="4" fill="#1E2024" stroke="#E88F1B" stroke-width="1"/>
    <text x="18" y="3" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="600">Calicut</text>
  </g>

  <!-- Pin 2: Perinthalmanna -->
  <g transform="translate(455, 390)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="12" fill="#E88F1B" opacity="0.25">
      <animate attributeName="r" values="6;16;6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#E88F1B"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    <rect x="-124" y="-10" width="114" height="22" rx="4" fill="#1E2024" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="-118" y="5" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">Perinthalmanna</text>
  </g>

  <!-- Pin 3: Palakkad -->
  <g transform="translate(468, 400)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="5" fill="#E88F1B"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    <rect x="12" y="-11" width="72" height="22" rx="4" fill="#1E2024" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="18" y="4" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">Palakkad</text>
  </g>

  <!-- Pin 4: Kochi (Hub Flagship) -->
  <g transform="translate(456, 435)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="20" fill="#E88F1B" opacity="0.3">
      <animate attributeName="r" values="10;24;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#E88F1B"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    <rect x="16" y="-14" width="88" height="26" rx="6" fill="#E88F1B"/>
    <text x="24" y="3" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">★ Kochi Hub</text>
  </g>
</svg>
